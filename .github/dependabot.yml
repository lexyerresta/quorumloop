version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: deps
    groups:
      nest:
        patterns:
          - '@nestjs/*'
      data:
        patterns:
          - drizzle-orm
          - postgres
          - nats
      tooling:
        patterns:
          - turbo
          - typescript
          - typescript-eslint
          - eslint
          - '@eslint/*'
          - prettier
          - vitest

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Jakarta
    commit-message:
      prefix: ci
