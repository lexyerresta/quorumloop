# Quorumloop event bus. JetStream is mandatory: durable consumers are how task and
# execution state stay consistent across restarts.
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
  max_memory_store: 512MB
  max_file_store: 8GB
}

# Self-hosted installs default to a private network. Add authorization here before exposing
# the port outside the Compose network.
authorization {
  timeout: 5
}

max_payload: 4MB
max_pending: 64MB
write_deadline: "10s"

logtime: true
