# Everything, including orchestration and execution. Execution still needs an explicit
# operator opt-in: EXECUTION_ENABLED must be true and at least one engine must be installed.
name: quorumloop

include:
  - path: compose.core.yml

x-extra: &extra
  restart: unless-stopped
  env_file:
    - ../../.env
  environment:
    SERVICE_DISCOVERY: dns
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  networks:
    - quorumloop
  profiles:
    - full
    - demo
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy

x-probe: &probe
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 30s

services:
  workspace-service:
    <<: *extra
    build:
      context: ../..
      dockerfile: services/workspace-service/Dockerfile
    environment:
      SERVICE_DISCOVERY: dns
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      WORKSPACE_ROOT: /workspace
    volumes:
      - worktrees:/workspace
    healthcheck:
      <<: *probe
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7008/health/live']

  agent-control-service:
    <<: *extra
    build:
      context: ../..
      dockerfile: services/agent-control-service/Dockerfile
